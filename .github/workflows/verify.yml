name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Image fitting regression tests
        run: node --test tests/image-fit.test.cjs
      - name: Image layout regression tests
        run: node --test tests/image-layout.test.cjs
      - name: GPX worker regression tests
        run: node --test tests/gpx-worker.test.cjs
      - run: npm run build
      - name: Dependency audit (report only)
        run: npm audit
        continue-on-error: true
      - name: Check plugin bundle
        run: |
          test -s main.js
          test -s styles.css
          node --check main.js
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if(m.id!=='obsidian-leaflet-plugin'||m.version!==p.version) process.exit(1)"
